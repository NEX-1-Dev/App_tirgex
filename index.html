<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝕋𝕚𝕘𝕣𝕖𝕩_𝕍𝟙_𝕓𝕠𝕥 ⚜️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s;
        }

        /* ===== المتغيرات ===== */
        :root {
            --bg-color: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #fff;
            --text-secondary: #888;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #667eea;
            --primary-dark: #764ba2;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --transition: 0.3s ease;
        }

        /* ===== وضع فاتح ===== */
        .light-theme {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1a1a2e;
            --text-secondary: #666;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        /* ===== الحاوية ===== */
        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        /* ===== الهيدر ===== */
        .header {
            text-align: center;
            padding: 20px 0 10px;
        }

        .header .logo {
            font-size: 48px;
        }

        .header h1 {
            color: var(--text-color);
            font-size: 24px;
            margin-top: 5px;
        }

        .header .sub {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== معلومات المستخدم ===== */
        .user-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-card .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            flex-shrink: 0;
        }

        .user-card .info .name {
            color: var(--text-color);
            font-size: 16px;
            font-weight: 600;
        }

        .user-card .info .id {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* ===== الإحصائيات ===== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .stat-card .number {
            color: var(--text-color);
            font-size: 20px;
            font-weight: bold;
        }

        .stat-card .label {
            color: var(--text-secondary);
            font-size: 10px;
            margin-top: 4px;
        }

        /* ===== الأقسام ===== */
        .section-title {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            margin: 20px 0 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 4px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .service-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px 12px;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .service-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .service-btn .icon {
            font-size: 24px;
        }

        .service-btn .label {
            font-size: 11px;
        }

        /* ===== أزرار المطور ===== */
        .dev-section {
            margin-top: 15px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 50, 50, 0.15);
        }

        .dev-section .title {
            color: #ff6b6b;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .dev-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .dev-btn {
            background: rgba(255, 50, 50, 0.08);
            border: 1px solid rgba(255, 50, 50, 0.12);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .dev-btn:hover {
            background: rgba(255, 50, 50, 0.15);
        }

        /* ===== روابط ===== */
        .links {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .links a {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 12px;
            border-radius: var(--radius);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }

        .btn-primary:hover {
            transform: scale(1.02);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        /* ===== الفوتر ===== */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 20px 0 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* ===== رسالة التحميل ===== */
        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 0;
            font-size: 14px;
        }

        /* ===== التجاوب ===== */
        @media (max-width: 380px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .services-grid {
                grid-template-columns: 1fr 1fr;
            }
            .dev-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- ===== التحميل ===== -->
        <div class="loading" id="loading">⏳ جاري التحميل...</div>

        <!-- ===== المحتوى ===== -->
        <div id="content" style="display:none;">
            <!-- الهيدر -->
            <div class="header">
                <div class="logo">⚜️</div>
                <h1>𝕋𝕀𝔾ℝ𝔼𝕏</h1>
                <div class="sub">NEX Empire 👑</div>
            </div>

            <!-- معلومات المستخدم -->
            <div class="user-card">
                <div class="avatar" id="userAvatar">👤</div>
                <div class="info">
                    <div class="name" id="userName">مرحباً بك!</div>
                    <div class="id" id="userId">🆔 جاري التحميل...</div>
                </div>
            </div>

            <!-- الإحصائيات -->
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="usersCount">0</div>
                    <div class="label">👥 مستخدمين</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="uptime">0</div>
                    <div class="label">⏱️ مدة التشغيل</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="downloads">0</div>
                    <div class="label">📥 تحميلات</div>
                </div>
            </div>

            <!-- الخدمات -->
            <div class="section-title">📱 التواصل الاجتماعي</div>
            <div class="services-grid">
                <button class="service-btn" onclick="sendCommand('/reels')">
                    <span class="icon">📱</span>
                    <span class="label">إنستغرام</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/pins')">
                    <span class="icon">🖼️</span>
                    <span class="label">Pinterest</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/video')">
                    <span class="icon">🎬</span>
                    <span class="label">فيديو</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/music')">
                    <span class="icon">🎵</span>
                    <span class="label">أغنية</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/soundcloud')">
                    <span class="icon">🎵</span>
                    <span class="label">SoundCloud</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/youtube')">
                    <span class="icon">🎬</span>
                    <span class="label">يوتيوب</span>
                </button>
            </div>

            <div class="section-title">🤖 الذكاء الاصطناعي</div>
            <div class="services-grid">
                <button class="service-btn" onclick="sendCommand('/nex')">
                    <span class="icon">💬</span>
                    <span class="label">NEX AI</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/gemini')">
                    <span class="icon">💬</span>
                    <span class="label">Gemini</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/deep')">
                    <span class="icon">🤖</span>
                    <span class="label">DeepSeek</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/gpt')">
                    <span class="icon">🤖</span>
                    <span class="label">GPT</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/generate')">
                    <span class="icon">🎨</span>
                    <span class="label">توليد صورة</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/enhance')">
                    <span class="icon">✨</span>
                    <span class="label">تحسين صورة</span>
                </button>
            </div>

            <div class="section-title">🎬 التصميم والتعديل</div>
            <div class="services-grid">
                <button class="service-btn" onclick="sendCommand('/edit')">
                    <span class="icon">🎨</span>
                    <span class="label">ايديت</span>
                </button>
                <button class="service-btn" onclick="sendCommand('/nano')">
                    <span class="icon">🖌️</span>
                    <span class="label">نانو بانانا</span>
                </button>
            </div>

            <!-- أزرار المطور -->
            <div class="dev-section" id="devSection" style="display:none;">
                <div class="title">🔑 لوحة المطور</div>
                <div class="dev-grid">
                    <button class="dev-btn" onclick="sendCommand('/stats')">📊 إحصائيات</button>
                    <button class="dev-btn" onclick="openBroadcast()">📢 إذاعة</button>
                </div>
            </div>

            <!-- الروابط -->
            <div class="links">
                <a href="https://t.me/Tigrex_V1_bot" class="btn-primary">🤖 البوت</a>
                <a href="https://t.me/+dojQs3Dxo-YzMDlk" class="btn-secondary">📢 القناة</a>
                <a href="https://t.me/NEX_DEV_V1" class="btn-secondary">👨‍💻 المطور</a>
            </div>

            <!-- الفوتر -->
            <div class="footer">
                ⚡ 𝕋𝕚𝕘𝕣𝕖𝕩_𝕍𝟙_𝕓𝕠𝕥<br>
                المطور: <a href="https://t.me/NEX_DEV_V1">NEX_DEV_V1</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ===== الحصول على كائن تيليجرام =====
        // ============================================================
        const tg = window.Telegram.WebApp;

        // ============================================================
        // ===== عرض معلومات المستخدم =====
        // ============================================================
        function loadUserInfo() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('userName').textContent = `${user.first_name || 'مستخدم'} ${user.last_name || ''}`;
                document.getElementById('userId').textContent = `🆔 ID: ${user.id}`;

                // ✅ التحقق من المطور
                const developerId = '6091149134';
                if (String(user.id) === developerId) {
                    document.getElementById('devSection').style.display = 'block';
                }
            }
        }

        // ============================================================
        // ===== جلب الإحصائيات من البوت =====
        // ============================================================
        async function fetchStats() {
            try {
                const response = await fetch('https://tigrex-v1-bot.up.railway.app/stats', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                // ملاحظة: هذا مجرد مثال، ستحتاج إلى إنشاء API في البوت لجلب الإحصائيات
                // بدلاً من ذلك، يمكنك عرض أرقام افتراضية
                document.getElementById('usersCount').textContent = '150';
                document.getElementById('uptime').textContent = '2س';
                document.getElementById('downloads').textContent = '45';
            } catch (error) {
                console.log('⚠️ فشل جلب الإحصائيات');
                document.getElementById('usersCount').textContent = '---';
                document.getElementById('uptime').textContent = '---';
                document.getElementById('downloads').textContent = '---';
            }
        }

        // ============================================================
        // ===== إرسال أمر إلى البوت =====
        // ============================================================
        function sendCommand(command) {
            tg.sendData(JSON.stringify({ command: command }));
            tg.showAlert(`✅ تم إرسال الأمر: ${command}`);
        }

        // ============================================================
        // ===== فتح الإذاعة =====
        // ============================================================
        function openBroadcast() {
            tg.sendData(JSON.stringify({ command: '/broadcast' }));
            tg.showAlert('📢 افتح البوت وأرسل رسالة الإذاعة');
        }

        // ============================================================
        // ===== تهيئة التطبيق =====
        // ============================================================
        function init() {
            // إخفاء التحميل وإظهار المحتوى
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // تحميل معلومات المستخدم
            loadUserInfo();

            // تحميل الإحصائيات
            fetchStats();

            // ✅ إعلام تيليجرام بأن التطبيق جاهز
            tg.ready();

            // ✅ توسيع التطبيق لملء الشاشة
            tg.expand();
        }

        // ============================================================
        // ===== بدء التطبيق =====
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
