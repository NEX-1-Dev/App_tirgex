<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝕋𝕚𝕘𝕣𝕖𝕩_𝕍𝟙_𝕓𝕠𝕥 ⚜️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-card .number {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }
        .stat-card .label {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin: 5px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        .footer {
            color: #555;
            font-size: 12px;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
        .user-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .user-info .name {
            color: #fff;
            font-size: 18px;
        }
        .user-info .id {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚜️</div>
        <h1>𝕋𝕀𝔾ℝ𝔼𝕏</h1>
        <div class="sub">NEX Empire 👑</div>

        <div class="user-info" id="userInfo">
            <div class="name" id="userName">👤 مرحباً بك!</div>
            <div class="id" id="userId">🆔 جاري التحميل...</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="usersCount">0</div>
                <div class="label">👥 المستخدمين</div>
            </div>
            <div class="stat-card">
                <div class="number" id="uptime">0</div>
                <div class="label">⏱️ مدة التشغيل</div>
            </div>
        </div>

        <div>
            <a href="https://t.me/Tigrex_V1_bot" class="btn">🤖 فتح البوت</a>
            <a href="https://t.me/+dojQs3Dxo-YzMDlk" class="btn btn-secondary">📢 القناة</a>
        </div>

        <div class="footer">
            ⚡ 𝕋𝕚𝕘𝕣𝕖𝕩_𝕍𝟙_𝕓𝕠𝕥<br>
            المطور: <a href="https://t.me/NEX_DEV_V1" style="color:#667eea;text-decoration:none;">NEX_DEV_V1</a>
        </div>
    </div>

    <script>
        // ✅ الحصول على معلومات المستخدم من تيليجرام
        const tg = window.Telegram.WebApp;
        
        // ✅ عرض معلومات المستخدم
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('userName').textContent = `👤 ${user.first_name || 'مستخدم'} ${user.last_name || ''}`;
            document.getElementById('userId').textContent = `🆔 ID: ${user.id}`;
        }

        // ✅ طلب إحصائيات من البوت (سيتم تنفيذها لاحقاً)
        // يمكنك إضافة API لجلب الإحصائيات الحقيقية

        // ✅ إظهار التطبيق
        tg.ready();
    </script>
</body>
</html>
